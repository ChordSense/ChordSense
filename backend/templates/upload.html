<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChordSense Upload</title>
    <link rel="stylesheet" href="{{ url_for('web_upload.static', filename='upload.css') }}" />
    <script defer src="{{ url_for('web_upload.static', filename='upload.js') }}"></script>
</head>
<body>
<main class="page-shell">
    <header class="header">
        <div>
            <p class="eyebrow">CHORDSENSE</p>
            <h1>Send audio to your ChordSense</h1>
            <p class="subtitle">Upload a song from this device and store it directly on the ChordSense computer.</p>
        </div>
        <div id="connection-badge" class="connection-badge">Checking connection…</div>
    </header>

    <section class="upload-card">
        <div id="drop-zone" class="drop-zone" tabindex="0" role="button" aria-label="Choose an audio file">
            <input id="file-input" type="file" accept="audio/*,.wav,.mp3,.ogg,.flac,.m4a" hidden />
            <p class="drop-title">Drop an audio file here</p>
            <p class="drop-copy">or click to choose a file</p>
            <button id="choose-file" class="button secondary" type="button">Choose Audio</button>
        </div>

        <div id="selection" class="selection hidden">
            <div>
                <p class="selection-label">Selected file</p>
                <strong id="selected-name"></strong>
                <p id="selected-size" class="muted"></p>
            </div>
            <button id="upload-button" class="button primary" type="button">Send to ChordSense</button>
        </div>

        <div id="progress-panel" class="progress-panel hidden">
            <div class="progress-row"><span>Uploading…</span><span id="progress-percent">0%</span></div>
            <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        </div>

        <p id="status-message" class="status-message" aria-live="polite"></p>
    </section>

    <section class="library-section">
        <div class="section-heading">
            <div><p class="eyebrow">ON CHORDSENSE</p><h2>Audio Library</h2></div>
            <button id="refresh-button" class="button secondary" type="button">Refresh</button>
        </div>
        <div id="library-empty" class="empty-state hidden">No uploaded audio yet.</div>
        <div id="library-list" class="library-list"></div>
    </section>
</main>
</body>
</html>
