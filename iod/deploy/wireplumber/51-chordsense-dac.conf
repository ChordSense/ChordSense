# Keeps the desktop's PipeWire/WirePlumber off the PCM5102A headphone DAC so
# chordsense-iod can open it directly (an ALSA hw device has one owner at a
# time; if PipeWire grabs it, iod fails with "Device or resource busy").
#
# Install (per user, no root):
#   mkdir -p ~/.config/wireplumber/wireplumber.conf.d
#   cp iod/deploy/wireplumber/51-chordsense-dac.conf ~/.config/wireplumber/wireplumber.conf.d/
#   systemctl --user restart wireplumber
# Check: `wpctl status` should no longer list a HifiBerry sink.

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*hifiberry*" }
      { alsa.card_name = "~*hifiberry*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
